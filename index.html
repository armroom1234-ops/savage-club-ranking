let data=JSON.parse(localStorage.getItem("savageV4")||"null")||initial;
function tier(i){if(i===0)return"CHAMPION";if(i===1)return"ELITE";if(i===2)return"MASTER";if(i<10)return"DIAMOND";if(i<20)return"PLATINUM";return"MEMBER"}
function badge(i){if(i===0)return badges.champion;if(i===1)return badges.elite;if(i===2)return badges.master;if(i<10)return badges.diamond;if(i<20)return badges.platinum;return badges.member}
function cls(t){return t==="MEMBER"?"membertier":t.toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function sorted(){return [...data].sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name))}
function render(){let d=sorted(),q=(document.getElementById("q").value||"").toLowerCase(),f=d.filter(x=>x.name.toLowerCase().includes(q));document.getElementById("rows").innerHTML=f.map(x=>{let i=d.findIndex(y=>y.name===x.name),t=tier(i);return `<tr><td><div class="rankbox"><img class="badge" loading="lazy" alt="${t}" src="${badge(i)}" onerror="this.style.display='none'"><span class="ranknum">#${i+1}</span></div></td><td class="member">${esc(x.name)}</td><td class="pts">${x.points}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td><span class="tier ${cls(t)}">${t}</span></td></tr>`}).join("")}
function renderEdit(){let d=sorted();document.getElementById("edit").innerHTML=d.map((x,i)=>`<div class="quick" style="grid-template-columns:1.7fr 58px 45px 45px 45px 45px"><div class="field"><b>#${i+1}</b> ${esc(x.name)}</div><input class="field" type="number" min="0" data-n="${esc(x.name)}" data-k="points" value="${x.points}"><input class="field" type="number" min="0" data-n="${esc(x.name)}" data-k="wins" value="${x.wins}"><input class="field" type="number" min="0" data-n="${esc(x.name)}" data-k="draws" value="${x.draws}"><input class="field" type="number" min="0" data-n="${esc(x.name)}" data-k="losses" value="${x.losses}"><span class="note">PTS/W/D/L</span></div>`).join("")}
function adj(enc,n){let x=data.find(y=>y.name===decodeURIComponent(enc));x.points=Math.max(0,x.points+n);renderEdit();render()}
function login(){if(prompt("รหัส Admin")!=="123456"){alert("รหัสไม่ถูกต้อง");return}document.getElementById("admin").classList.add("open");document.getElementById("pubTab").classList.remove("active");document.getElementById("adminTab").classList.add("active");renderEdit()}
function publicView(){document.getElementById("admin").classList.remove("open");document.getElementById("pubTab").classList.add("active");document.getElementById("adminTab").classList.remove("active");render()}
function save(){document.querySelectorAll("#edit input").forEach(e=>{let x=data.find(y=>y.name===e.dataset.n);if(x)x[e.dataset.k]=Math.max(0,+e.value||0)});localStorage.setItem("savageV4",JSON.stringify(data));render();alert("บันทึก Ranking แล้ว")}
render();
</script></body></html>
